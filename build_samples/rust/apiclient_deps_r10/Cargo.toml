[package]
name = "apiclient_deps_r10"
version = "0.1.0"
edition = "2021"

# Rust build variant: REAL DEPENDENCIES (serde, reqwest) + crypto (sha2).
[dependencies]
reqwest = { version = "0.12", features = ["blocking", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
